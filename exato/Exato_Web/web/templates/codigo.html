{% extends "base.html" %}{% block titulo %}Código de verificação{% endblock %}
{% block solo %}<div class="entrar"><div class="logo"><img src="/static/logo.png" alt=""><h1>Verificação</h1></div>
<form method="post" action="/login/codigo" class="card">{% if erro %}<div class="aviso erro">{{ erro }}</div>{% endif %}
<p>Digite o código de 6 números do aplicativo autenticador.</p><input type="hidden" name="csrf" value="{{ csrf }}">
<input name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required autofocus><button>Confirmar</button></form></div>{% endblock %}
