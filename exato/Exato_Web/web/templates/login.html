{% extends "base.html" %}{% block titulo %}Entrar — Exato Central Fiscal{% endblock %}
{% block solo %}<div class="entrar"><div class="logo"><img src="/static/logo.png" alt=""><h1>Exato Central Fiscal</h1></div>
<form method="post" action="/login" class="card">{% if erro %}<div class="aviso erro">{{ erro }}</div>{% endif %}
<input type="hidden" name="csrf" value="{{ csrf }}"><label>E-mail</label><input name="email" type="email" autocomplete="username" required autofocus>
<label>Senha</label><input name="senha" type="password" autocomplete="current-password" required><button>Entrar</button></form></div>{% endblock %}
