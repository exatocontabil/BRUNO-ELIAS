<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Exato Central Fiscal{% endblock %}</title><link rel="icon" href="/static/logo.png"><link rel="stylesheet" href="/static/estilo.css"></head>
<body>{% if usuario %}<div class="layout"><nav class="menu"><div class="logo"><img src="/static/logo.png" alt=""><b>exato</b></div>
<a href="/situacao" class="{{ 'ativo' if tela=='situacao' }}">Situação da busca</a><a href="/empresas" class="{{ 'ativo' if tela=='empresas' }}">Empresas</a>
<a href="/auditoria" class="{{ 'ativo' if tela=='auditoria' }}">Auditoria</a><a href="/certificados" class="{{ 'ativo' if tela=='certificados' }}">Certificados A1</a><a href="/repositorio" class="{{ 'ativo' if tela=='repositorio' }}">Repositório</a><a href="/fechamento" class="{{ 'ativo' if tela=='fechamento' }}">Fechamento</a><a href="/boxe" class="{{ 'ativo' if tela=='boxe' }}">Box-e</a><a href="/relatorios" class="{{ 'ativo' if tela=='relatorios' }}">Relatórios</a><a href="/documentos" class="{{ 'ativo' if tela=='documentos' }}">Documentos</a>
<form method="post" action="/sair"><input type="hidden" name="csrf" value="{{ csrf }}"><small class="mu">{{ usuario.name }}</small><br><button class="sec" style="margin-top:8px;width:100%">Sair</button></form></nav>
<main class="conteudo">{% block corpo %}{% endblock %}</main></div>{% else %}{% block solo %}{% endblock %}{% endif %}</body></html>
